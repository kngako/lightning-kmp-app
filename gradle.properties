#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
# Off because the experimental/lightning-kmp composite build reaches, through its own bitcoin-kmp
# and secp256k1-kmp submodules, two tasks that cannot be serialized: secp256k1-kmp's
# `:jni:generateHeaders` and `:native:buildSecp256k1<target>` both hold gradle script object
# references. The configuration cache covers a whole build tree, so an included build's
# incompatibility is the outer build's problem -- there is no per-build opt-out. Re-enable this
# once those two tasks are fixed upstream in the secp256k1-kmp fork, or if the includeBuild goes.
org.gradle.configuration-cache=false
#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir
#MPP
kotlin.mpp.enableCInteropCommonization=true
# jitpack only has linux builders, so the ios klibs have to be cross-compiled to be published at all.
# klibs are all this produces -- linking an actual ios binary still needs a mac, which is the
# consumer's machine, not ours. This would not work if the library declared its own cinterops.
kotlin.native.enableKlibsCrossCompilation=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
